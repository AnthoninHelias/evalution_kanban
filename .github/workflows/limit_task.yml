name: Limiter les attributions de tâches

on:
  issues:
    types: [assigned]

jobs:
  limit-assignee:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le nombre de tâches assignées
        uses: actions/github-script@v6
        with:
          script: |
            const assignee = context.payload.assignee.login;
            const issues = await github.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              assignee: assignee,
              state: 'open'
            });
            const assignedIssues = issues.data.filter(issue => issue.assignees.some(a => a.login === assignee));
            if (assignedIssues.length > 2) {
              core.setFailed(`L'utilisateur ${assignee} a déjà 2 tâches assignées.`);
            }
